<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're invited to {{ .BrandName }}</title>
    <style type="text/css">
        body { margin: 0; padding: 0; background-color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        table { border-spacing: 0; border-collapse: collapse; }
        td { padding: 0; }
        img { border: 0; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #F3F4F6; padding-bottom: 40px; }
        .main { background-color: #FFFFFF; margin: 0 auto; width: 100%; max-width: 600px; border-radius: 8px; border: 1px solid #E5E7EB; overflow: hidden; margin-top: 40px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
        .button:hover { opacity: 0.92 !important; }
        @media screen and (max-width: 600px) {
            .main { border-radius: 0; border: none; margin-top: 0; box-shadow: none; }
            .padding-inner { padding: 20px !important; }
        }
</style>
</head>
<body style="margin: 0; padding: 0; background-color: #F3F4F6;">
    <center class="wrapper" style="width: 100%; table-layout: fixed; background-color: #F3F4F6; padding-bottom: 40px;">
        <table class="main" width="100%" align="center"
            style="background-color: #FFFFFF; margin: 0 auto; width: 100%; max-width: 600px; border-radius: 8px; border: 1px solid #E5E7EB; margin-top: 40px; border-spacing: 0; font-family: sans-serif; color: #111827;">
            <tr>
                <td style="padding: 30px; text-align: center; border-bottom: 1px solid #E5E7EB; background-color: #FFFFFF;">
                    <a href="{{ .HomepageURL }}" style="text-decoration: none;"><img src="{{ .LogoURL }}" alt="{{ .BrandName }}" width="160" height="46" style="display: inline-block; height: 40px; width: auto; max-width: 200px; border: 0; outline: none; text-decoration: none;" /></a>
                </td>
            </tr>
            <tr>
                <td class="padding-inner" style="padding: 40px 30px;">
                    <table width="100%" style="border-spacing: 0;">
                        <tr>
                            <td>
                                <h2 style="margin: 0 0 20px 0; font-size: 20px; font-weight: 600; color: #111827;">You're invited</h2>
                                <p style="margin: 0 0 18px 0; font-size: 15px; line-height: 1.6; color: #4B5563;"><strong>{{ .InviterEmail }}</strong> invited you to a project on {{ .BrandName }}.</p><p style="margin: 0 0 18px 0; font-size: 15px; line-height: 1.6; color: #4B5563;">Sign in to accept the invitation.</p>
                            </td>
                        </tr>
                                                <tr>
                            <td style="text-align: center; padding-top: 8px;">
                                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto; border-spacing: 0;">
                                <tr>
                                    <td align="center" bgcolor="{{ .PrimaryColor }}" style="border-radius: 6px;">
                                        <a href="{{ .SignInLink }}" class="button" style="display: inline-block; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; padding: 14px 32px; border-radius: 6px;">
                                            Sign In
                                        </a>
                                    </td>
                                </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td style="padding: 25px 30px; text-align: center; border-top: 1px solid #E5E7EB; background-color: #F9FAFB;">
                    <p style="margin: 0 0 10px 0; font-size: 12px; color: #6B7280; font-weight: 600;">
                        <span style="margin: 0 10px;">🔒 AES-256 Encrypted</span>
                    </p>
                    <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #9CA3AF;">
                        {{ .BrandName }} &copy; 2026 All rights reserved.
                    </p>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
