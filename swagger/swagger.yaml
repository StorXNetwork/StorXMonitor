            $ref: '#/definitions/seller.SellerAuthErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seller.SellerAuthErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/seller.SellerAuthErrorResponse'
      security:
      - SellerCookieAuth: []
      - SellerCSRFAuth: []
      summary: Delete custom theme
      tags:
      - reseller-branding
    put:
      consumes:
      - application/json
      description: '**Route:** `PUT /api/v0/seller/themes/custom/{id}`'
      parameters:
      - description: Theme ID
        in: path
        name: id
        required: true
        type: string
      - description: Custom theme
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/seller.UpdateCustomThemeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seller.ResellerCustomTheme'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/seller.SellerAuthErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seller.SellerAuthErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/seller.SellerAuthErrorResponse'
      security:
      - SellerCookieAuth: []
      - SellerCSRFAuth: []
      summary: Update custom theme
      tags:
      - reseller-branding
  /seller/themes/presets:
    get:
      description: '**Route:** `GET /api/v0/seller/themes/presets`'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/seller.ThemePresetSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seller.SellerAuthErrorResponse'
      security:
      - SellerCookieAuth: []
      summary: List system theme presets
      tags:
      - reseller-branding
  /user-guideline-for-app:
    get:
      description: '**Full route:** `GET /user-guideline-for-app` (server root, not
        under `/api/v0`).'
      produces:
      - text/html
      responses:
        "200":
          description: HTML usage guideline page
          schema:
            type: string
      summary: Mobile app usage guideline
      tags:
      - static-api
  /user/notification-preferences:
    get:
      description: '**Full route:** `GET /api/v0/user/notification-preferences`. Settings
        → Notification preferences. Returns a JSON **array** with zero or one global
        preference row. Each row `Preferences` map uses keys `push`, `email`, `sms`
        with minimum priority levels 1–4 (marketing, info, warning, critical).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/consoleapi.UserNotificationPreferenceSwagger'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
      security:
      - CookieAuth: []
      summary: Get notification preferences
      tags:
      - settings-notification-preferences
    put:
      consumes:
      - application/json
      description: '**Full route:** `PUT /api/v0/user/notification-preferences`. Settings
        → Notification preferences. Upserts global channel thresholds applied to all
        notifications. `preferences` may include any of `push`, `email`, `sms` — each
        value is minimum priority to receive: 1=marketing, 2=info, 3=warning, 4=critical
        (string names `marketing`/`info`/`warning`/`critical` also accepted). Returns
        `201` on create, `200` on update.'
      parameters:
      - description: Global channel preferences
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/consoleapi.UpsertUserNotificationPreferenceSwaggerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/consoleapi.UserNotificationPreferenceSwagger'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/consoleapi.UserNotificationPreferenceSwagger'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
      security:
      - CookieAuth: []
      summary: Create or update notification preference
      tags:
      - settings-notification-preferences
  /v1/access:
    post:
      consumes:
      - application/json
      description: '**Full route:** `POST /v1/access` (server root on the StorX auth
        host, e.g. `https://storx.io/v1/access`).'
      parameters:
      - description: Access grant and visibility
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/consoleapi.V1AccessCreateSwaggerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/consoleapi.V1AccessCreateSwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
      summary: Exchange access grant for S3 credentials
      tags:
      - access
securityDefinitions:
  ApiKeyAuth:
    description: Bearer / API key (rare for console routes).
    in: header
    name: Authorization
    type: apiKey
  CSRFAuth:
    description: 'When `console.csrf-protection-enabled` is true: copy `csrfToken`
      from `GET /config` and Authorize here. Must match `csrf_token` cookie (set by
      GET /config or synced by Swagger UI). Required for `POST /auth/token`, `POST
      /auth/account/set-password`, and other CSRF-protected routes.'
    in: header
    name: X-CSRF-Token
    type: apiKey
  CookieAuth:
    description: Session cookie after login. **Swagger Authorize:** paste the token
      value only (from `POST /auth/token` response `token` field). Do not prefix with
      `Cookie:` or `_tokenKey=`. Copied curl uses `-b '_tokenKey=...'` (not a header).
      Login via Swagger auto-fills this.
    in: cookie
    name: _tokenKey
    type: apiKey
  SellerCSRFAuth:
    description: 'When `seller.csrf-protection-enabled` is true: copy `csrfToken`
      from `GET /seller/config` and Authorize here. Must match `csrf_token` cookie
      (set by GET /seller/config). Required for `POST /seller/auth/token`, MFA routes,
      password change, and other CSRF-protected seller routes.'
    in: header
    name: X-CSRF-Token
    type: apiKey
  SellerCookieAuth:
    description: Session cookie after reseller Google login. **Swagger Authorize:**
      paste the token value only (from `GET /seller/auth/google` response `token`
      field). Seller peer cookie name is `_seller_tokenKey` (not console `_tokenKey`).
    in: cookie
    name: _seller_tokenKey
    type: apiKey
swagger: "2.0"
tags:
- description: 'Project management: CRUD, salt, usage, config. Team invite + Member
    bucket restriction APIs are under tag **member-bucket-restriction**.'
  name: projects
- description: 'Member bucket & folder restriction — ALL invite/member/ACL APIs in
    one place. Flag: console.member-bucket-grants-enabled (default OFF). OFF = existing
    one-user/project access unchanged. ON = Owner/Admin full access; Member only grant
    rows (bucket+prefix+List/Download; Upload/Delete unsupported). Test order: (1)
    CookieAuth+CSRF (2) create/ensure bucket (3) POST member-acl-buckets (4) POST
    invite/{email} (omit body = defaults email/ List+Download) (5) GET members (6)
    invitee GET invitations + POST respond response=1 (7) GET/PUT members/{id}/bucket-grants
    (8) PATCH role / DELETE / reinvite / invite-link. Prefix must end with /. PUT
    grants:[] clears Member access + invalidates keys.'
  name: member-bucket-restriction
- description: 'Storage & bandwidth trends: GET /api/v0/projects/{id}/daily-usage
    — daily storageUsage and settledBandwidthUsage (bytes per day) for charts'
  name: projects-daily-usage
- description: 'S3 credentials & vault setup: GET /api/v0/projects/{id}/config — salt,
    passphrase, role, placements, and feature flags for access-grant / vault flows
    in the frontend'
  name: projects-s3-vault-setup
- description: 'S3 credentials & vault setup: DELETE /api/v0/api-keys/delete-by-name
    — remove an API key by name and project when revoking S3 credentials from the
    frontend vault flow'
  name: api-keys-s3-vault-setup
- description: 'Bucket management: usage-totals (paginated per-bucket usage), usage-totals-for-reserved,
    and bucket APIs'
  name: buckets
- description: 'Reserved integration vault usage: GET /api/v0/buckets/usage-totals-for-reserved
    — bucketName, storage (GB), objectCount per vault (Google Backup, Microsoft Backup,
    Dropbox, etc.)'
  name: buckets-reserved-usage
- description: 'Storage & bandwidth quota popup: POST /api/v0/buckets/check-upload
    — usage percents, allow_upload/download, popup_show + message (login, upload,
    download). Same usage data as dashboard quota cards.'
  name: buckets-quota-check
- description: API key management operations
  name: api-keys
- description: 'Payment and billing: GET /payment-plans (server root), GET /api/v0/payments/coupons,
    POST /api/v0/payments/generate-payment-link, GET /api/v0/payments/invoice-history'
  name: payments
- description: Analytics operations
  name: analytics
- description: 'Google Backup combined auth: `GET /auth/google-backup` (register or
    login by email). Returns `action`, `onboarding` block, and `google_backup`. OAuth
    redirect = `GOOGLE_OAUTH_REDIRECT_URL_GOOGLE_BACKUP`.'
  name: google-backup-onboarding
- description: 'Microsoft Backup combined auth: `GET /auth/microsoft-backup` (register
    or login by email). Same as Google: UI builds OAuth authorize URL client-side
    (`OUTLOOK_CLIENT_ID`, frontend origin, `MicrosoftBackupScopes`, `prompt=consent`);
    callback exchanges `code` here. Returns `action`, `token`, `onboarding`, and `microsoft_backup`.
    Config: `OUTLOOK_CLIENT_ID` / `OUTLOOK_CLIENT_SECRET` / `OUTLOOK_OAUTH_REDIRECT_URL_MICROSOFT_BACKUP`.'
  name: microsoft-backup-onboarding
- description: 'Microsoft Backup product APIs under `/api/v0/microsoft-backup/*` →
    Backup-Tools `/microsoft/*`. Job create uses stored credential `account_type`
    + `tenant_id` (not UI body). Services: outlook/mail, calendar, contacts, onedrive,
    sharepoint (+ `sites[]`), teams (+ `teams[]` or `backup_scope=all_tenant`), groups
    (+ `groups[]` or `backup_scope=all_tenant`).'
  name: microsoft-backup
- description: 'GET/PUT `/microsoft-backup/users-groups/*` → Backup-Tools `/microsoft/users-groups/*`.
    Method filter: outlook, outlook_calendar, outlook_contacts, outlook_onedrive,
    outlook_sharepoint, outlook_teams, outlook_groups. List response splits `mailboxes`
    vs `organization_resources` (`sharepoint_sites`, `teams`, `groups`).'
  name: microsoft-backup-users-groups
- description: Common backup auto-sync + policy for Google + Microsoft under `/api/v0/backup/auto-sync/*`
    → Backup-Tools `/auto-sync/*` (Google template until BT unifies Microsoft). Alerts
    and logs stay on `/dashboard/*`.
  name: backup
- description: 'Live backup progress: `GET /api/v0/backup/auto-sync/live` → Backup-Tools
    `GET /auto-sync/live` (Google + Microsoft when BT unified).'
  name: backup-autosync-live
- description: 'Deprecated: use `/api/v0/backup/auto-sync/policy/*` (common). Legacy
    Microsoft policy routes removed from Satellite.'
  name: microsoft-backup-policy
- description: Browse Outlook mail/contacts/calendar, SharePoint sites/files, Teams,
    and M365 Groups via `/microsoft-backup/query-messages|contacts/list|calendar/*|sharepoint/*|teams/*|groups/*`.
    Requires `REFRESH_TOKEN` header (or `refresh_token` query). SharePoint, teams,
    and groups browse require admin_workspace.
  name: microsoft-backup-browse
- description: 'Google Backup provider APIs: connect, domain-users, job create (`POST
    /google-backup/auto-sync/jobs`), restore. Shared list/live/policy/job-mutate use
    `/api/v0/backup/auto-sync/*`.'
  name: google-backup
- description: 'Deprecated: use `GET /api/v0/backup/auto-sync/live`.'
  name: google-backup-autosync-live
- description: 'Deprecated: use `/api/v0/backup/auto-sync/policy/*` (common Backup-Tools
    `/auto-sync/policy/*`).'
  name: google-backup-policy
- description: GET /google-backup/users-groups/* — list returns `entities[].org_unit_path`
    and `org_units` (Google Admin OU paths stored on jobs; no groups table). Filter
    `org_unit_path`; `search` also matches OU path.
  name: google-backup-users-groups
- description: 'Google Backup authentication: POST /google-backup/google-auth (Backup-Tools
    google-auth JWT)'
  name: google-backup-auth
- description: 'Google Backup manual restore: POST /google-backup/google/* (1–10 vault
    keys per request; same body for single or multiple items). Authorization header
    = Backup-Tools JWT from POST /google-backup/google-auth. No ACCESS_TOKEN (StorX
    from DB). Session cookie required.'
  name: google-backup-restore-manual
- description: 'Google Backup restore-all: target picker GET /restore/credentials
    (personal) and GET /restore/workspaces (domain tabs + mailboxes; replaces workspace-mailboxes),
    preflight GET /restore/prepare (optional target_email), POST /restore/all, job
    polling GET /restore/live|jobs|job/* (token_key only; no ACCESS_TOKEN). List/detail/live
    use {message,success,failed} envelope except credentials/workspaces/prepare. UI
    service param (gmail,drive,...) maps to DB method (gmail,google_drive,...). OAuth
    reconnect via POST /google-backup/connect or PUT /backup/auto-sync/jobs/project.'
  name: google-backup-restore-cron
- description: 'Protected Services overview: `GET /dashboard/stats`, `GET /dashboard/alerts`,
    `GET /dashboard/backup-restore/logs`. Job list/live/policy use `/api/v0/backup/auto-sync/*`.'
  name: dashboard
- description: 'Logged-in account: profile (`GET/PATCH /auth/account` — check `hasPassword`),
    change-password when password exists, MFA, settings, onboarding PATCH, refresh-session,
    developer-access. Login: Google via `/auth/google-backup`, Microsoft via `/auth/microsoft-backup`,
    or email via `POST /auth/token`.'
  name: auth-account
- description: '**Email + password login:** `GET /config` first for `captcha.login`
    site keys and `csrfToken` when CSRF is enabled, then `POST /auth/token` with `captchaResponse`
    and optional `X-CSRF-Token` header. Sets `_tokenKey` cookie. Response: `token`,
    `success`, `action` (`logged_in`), `onboarding` (same block as google-backup),
    `google_backup` when user has stored Google credentials (scopes refreshed via
    refresh token). Send `mfaPasscode` or `mfaRecoveryCode` on second request if MFA
    enabled.'
  name: auth-email-login
- description: '**Optional first password** when `GET /auth/account` returns `hasPassword:
    false`. **Swagger test:** (1) `GET /config` → copy `csrfToken`. (2) Authorize
    **CookieAuth** = `_tokenKey` value from Google login / `auth/token`. (3) Authorize
    **CSRFAuth** = same `csrfToken`. (4) `POST /auth/account/set-password` with `{
    "newPassword": "..." }`.'
  name: auth-set-password
- description: '**Forgot password (no CSRF):** `POST /auth/forgot-password` and `POST
    /auth/reset-password` do **not** require `X-CSRF-Token` (only login captcha /
    recovery token). Flow: forgot-password → email link `/password-recovery?token=`
    → reset-password → **`POST /auth/token` needs CSRF** when enabled: call `GET /config`
    first, copy `csrfToken`, Authorize **CSRFAuth**, then login with the new password.'
  name: auth-password-recovery
- description: 'Settings → Push devices: register and manage FCM tokens at `/api/v0/fcm-token`
    (session cookie). IP address is set server-side.'
  name: settings-fcm
- description: 'Settings → Notification preferences: global channel thresholds at
    `/api/v0/user/notification-preferences` (push, email, sms minimum priority levels
    applied to all notifications).'
  name: settings-notification-preferences
- description: 'Access management: GET /api/v0/api-keys/list-paged (paginated keys),
    POST /v1/access (exchange access grant for S3 credentials on auth host)'
  name: access
- description: 'In-app notifications: GET/PUT /api/v0/notifications (list, count,
    detail, dismiss, read-all)'
  name: notifications
- description: 'Public console bootstrap config: GET /api/v0/config (feature flags,
    API base URL, CSRF token, billing/UI toggles)'
  name: config
- description: 'System audit logs: GET /api/v0/audit-logs (list with filters), GET
    /api/v0/audit-logs/actions (filter dropdown), GET /api/v0/audit-logs/export (CSV)'
  name: audit-logs
- description: 'Public static content at server root (not under /api/v0): GET /resources-list,
    /blog-list, /guides, /user-guideline-for-app. Swagger may prefix paths with /api/v0
    — use the host root path when calling.'
  name: static-api
- description: 'Seller peer (reseller console): health and reseller management APIs
    under `/api/v0/seller/*`. Runs as `satellite run seller` (default sim port often
    `:10003`).'
  name: reseller
- description: 'Reseller authentication: Google OAuth, email register/login, activation,
    logout, and refresh under `/api/v0/seller/auth/*`. Session cookie = `_seller_tokenKey`.'
  name: reseller-auth
- description: 'Reseller password recovery: `POST /seller/auth/forgot-password` and
    `POST /seller/auth/reset-password` (token from email link).'
  name: reseller-auth-password
- description: 'Logged-in reseller profile and password management: `GET/PATCH /seller/auth/account`,
    change/set password, change email, delete account.'
  name: reseller-account
- description: 'Reseller MFA setup and recovery: `POST /seller/auth/mfa/*` (enable,
    disable, secret key, recovery codes).'
  name: reseller-mfa
- description: 'Reseller active sessions: `GET /seller/auth/sessions`, `POST /seller/auth/invalidate-session/{id}`.'
  name: reseller-sessions
- description: 'Reseller branding: multipart upload for logos/favicon stored flat
    under `{branding-assets-dir}/reseller/`. Config: `brandName` (also used as page
    title), `supportEmail`, `theme`, `logo`, `favicon`.'
  name: reseller-branding
- description: 'Reseller custom domain: `GET /seller/domain`, `POST /seller/domain/connect`,
    `PUT /seller/domain/update` (one custom domain per reseller, no DNS validation).'
  name: reseller-domain
