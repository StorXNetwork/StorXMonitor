        (or `OUTLOOK_OAUTH_REDIRECT_URL_MICROSOFT_BACKUP`). MSAL JWT-as-code still
        works for login but will not yield refresh_token. Returns `action`, `token`,
        `onboarding`, and `microsoft_backup` (`email`, `account_type` for consumer
        mail, `has_refresh_token`). Sets session cookie.'
      parameters:
      - description: Microsoft OAuth authorization code (preferred) or MSAL idToken/accessToken
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state (UTM / verifier payload)
        in: query
        name: state
        type: string
      - description: When true, inserts CRM lead in Zoho
        in: query
        name: zoho-insert
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 'Set-Cookie: _tokenKey'
          schema:
            $ref: '#/definitions/consoleapi.MicrosoftBackupAuthSuccess'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/consoleapi.MicrosoftBackupAuthError'
