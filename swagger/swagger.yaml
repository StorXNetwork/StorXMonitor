paths:
  /api-keys/delete-by-name:
    delete:
      description: '**Full route:** `DELETE /api/v0/api-keys/delete-by-name`'
      parameters:
      - description: API key display name
        in: query
        name: name
        required: true
        type: string
      - description: Project internal UUID (use this or publicID)
        in: query
        name: projectID
        type: string
      - description: Project public UUID (use this or projectID)
        in: query
        name: publicID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: API key deleted
        "204":
          description: API key not found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete API key by name (S3 credentials / vault setup)
      tags:
      - api-keys-s3-vault-setup
  /api-keys/list-paged:
    get:
      description: '**Full route:** `GET /api/v0/api-keys/list-paged`'
      parameters:
      - description: Project UUID
        in: query
        name: projectID
        required: true
        type: string
      - description: Page size
        example: 10
        in: query
        name: limit
        required: true
        type: integer
      - description: Page number (1-based)
        example: 1
        in: query
        name: page
        required: true
        type: integer
      - description: 'Sort field: 1=name, 2=created, 3=creator email'
        example: 1
        in: query
        name: order
        required: true
        type: integer
      - description: Sort direction
        example: 1
        in: query
        name: orderDirection
        required: true
        type: integer
      - description: Name search filter
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/consoleapi.APIKeysListPagedSwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/consoleapi.SwaggerErrorResponse'
      security:
      - CookieAuth: []
      summary: List API keys (paginated)
      tags:
      - access
