name: Build Satellite on CyberLS

on:
  workflow_dispatch:
    inputs:
      run_go_mod_tidy:
        description: 'Run go mod tidy'
        required: false
        default: false
        type: boolean

env:
  BIN_PATH: 'D:\bin'
  TEMP_PATH: 'D:\deployment'
  MAIL_TEMPLATES_PATH: 'D:\Mails'
  SERVICES: 'StorxBackup,StorxAuditor,storxnetworksatellite'

jobs:
  build-satellite:
    runs-on: [self-hosted, windows, production, cyberls]
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Setup Git Auth for Private Go Modules
      shell: powershell
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git config --global url."https://x-access-token:$env:PERSONAL_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"
        go env -w GOPRIVATE=github.com/StorXNetwork/*
        go env -w GONOSUMDB=github.com/StorXNetwork/*
        go env -w GONOPROXY=github.com/StorXNetwork/*
        $gomodcache = if ($env:RUNNER_TEMP) { "$env:RUNNER_TEMP\go-mod-cache" } else { "$env:GITHUB_WORKSPACE\.go-mod-cache" }
        New-Item -ItemType Directory -Force -Path $gomodcache | Out-Null
        go env -w GOMODCACHE=$gomodcache

    - name: Validate Go module access
      shell: powershell
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        GIT_TERMINAL_PROMPT: '0'
      run: |
        $ErrorActionPreference = 'Continue'
        $failed = $false

        Write-Host "=== 1. PERSONAL_ACCESS_TOKEN ==="
        if ([string]::IsNullOrWhiteSpace($env:PERSONAL_ACCESS_TOKEN)) {
          Write-Host "FAIL: secret is empty or not available to the production environment"
          $failed = $true
        } else {
          Write-Host "PASS: secret is set (length $($env:PERSONAL_ACCESS_TOKEN.Length))"
        }

        Write-Host "=== 2. Go version ==="
        $verOutput = go version
        Write-Host $verOutput
        if ($verOutput -notmatch 'go1\.(2[5-9]|[3-9]\d)') {
          Write-Host "FAIL: go.mod requires go 1.25 or newer"
          $failed = $true
        } else {
          Write-Host "PASS: Go is 1.25 or newer"
        }

        Write-Host "=== 3. Go module env ==="
        go env GOPRIVATE GONOPROXY GONOSUMDB GOMODCACHE GOPROXY GOTOOLCHAIN
        $goprivate = (go env GOPRIVATE).Trim()
        if ($goprivate -notmatch 'StorXNetwork') {
          Write-Host "FAIL: GOPRIVATE does not include github.com/StorXNetwork/*"
          $failed = $true
        } else {
          Write-Host "PASS: GOPRIVATE=$goprivate"
        }

        Write-Host "=== 4. Module cache ==="
        $modcache = (go env GOMODCACHE).Trim()
        Write-Host "GOMODCACHE=$modcache"
        $privateCache = Join-Path $modcache "github.com\StorXNetwork"
        if (Test-Path $privateCache) {
          Write-Host "PASS: private module cache exists at $privateCache"
        } else {
          Write-Host "WARN: $privateCache is missing; tidy/build must fetch private modules over the network"
        }

        Write-Host "=== 5. git ls-remote private module ==="
        git ls-remote https://github.com/StorXNetwork/common.git HEAD
        if ($LASTEXITCODE -ne 0) {
          Write-Host "FAIL: cannot read github.com/StorXNetwork/common (PAT missing scopes, expired, SSO not authorized, or git insteadOf not applied)"
          $failed = $true
        } else {
          Write-Host "PASS: git can read github.com/StorXNetwork/common"
        }

        if ($failed) {
          Write-Host "One or more validation checks failed. Fix the FAIL lines above before running go mod tidy."
          exit 1
        }
        Write-Host "All validation checks passed"

    - name: Go mod tidy
      if: github.event_name == 'workflow_dispatch' && inputs.run_go_mod_tidy == true
      shell: cmd
      run: go mod tidy

    - name: Fast build satellite.exe
      env:
        WEB3_AUTH_PRIVATE_KEY: ${{ secrets.WEB3_AUTH_PRIVATE_KEY }}
      run: |
        $buildStart = Get-Date
        Write-Host "Building satellite.exe with optimizations..."
        
        # Use Go build cache and skip tests for faster build
        $env:GOFLAGS = "-buildvcs=false"
        
        # Build the ldflags with proper variable expansion
        $ldflags = "-s -w -X 'github.com/StorXNetwork/StorXMonitor/satellite/console/secretconstants.Web3AuthPrivateKey=$env:WEB3_AUTH_PRIVATE_KEY'"
        $buildCmd = "go build -ldflags `"$ldflags`" -o `"$env:TEMP_PATH\satellite.exe`" ./cmd/satellite"
        Write-Host "Build command: $buildCmd"
        
        Invoke-Expression $buildCmd
        
        $buildTime = (Get-Date) - $buildStart
        Write-Host "Build completed in $($buildTime.TotalSeconds) seconds"
        
        if (Test-Path "$env:TEMP_PATH\satellite.exe") {
          $size = (Get-Item "$env:TEMP_PATH\satellite.exe").Length
          Write-Host "satellite.exe built successfully ($([math]::Round($size/1MB, 2)) MB)"
        } else {
          Write-Error "Build failed - satellite.exe not found"
          exit 1
        }
        
    - name: Parallel service stop
      run: |
        $services = $env:SERVICES -split ','
        $stopJobs = @()
        
        foreach ($service in $services) {
          $stopJobs += Start-Job -ScriptBlock {
            param($serviceName, $binPath)
            Set-Location $binPath
            $status = (Get-Service -Name $serviceName -ErrorAction SilentlyContinue).Status
            if ($status -eq "Running" -or $status -eq "Paused" -or $status -eq "StartPending") {
              & ".\nssm.exe" stop $serviceName 2>&1 | Out-Null
            }
          } -ArgumentList $service, $env:BIN_PATH
        }
        
        # Wait for all stop jobs to complete (max 10 seconds)
        $stopJobs | Wait-Job -Timeout 10 | Out-Null
        Write-Host "All services stopped or timeout reached"
        
    - name: Quick file replacement
      run: |
        # Minimal file operations
        if (Test-Path "$env:BIN_PATH\satellite.exe") {
          Remove-Item "$env:BIN_PATH\satellite.exe" -Force -ErrorAction SilentlyContinue
        }
        Move-Item "$env:TEMP_PATH\satellite.exe" "$env:BIN_PATH\satellite.exe" -Force
        Write-Host "satellite.exe replaced"

    - name: Deploy mail templates
      shell: powershell
      run: |
        $src = Join-Path $env:GITHUB_WORKSPACE 'mail-templates'
        $dest = $env:MAIL_TEMPLATES_PATH
        if (-not (Test-Path $src)) {
          Write-Error "mail-templates directory not found at $src"
          exit 1
        }
        if (Test-Path $dest) {
          Remove-Item $dest -Recurse -Force
        }
        Copy-Item -Path $src -Destination $dest -Recurse -Force
        $count = (Get-ChildItem (Join-Path $dest 'emails') -Filter '*.html').Count
        Write-Host "Deployed $count email templates to $dest"
        
    - name: Parallel service start
      run: |
        $services = $env:SERVICES -split ','
        $startJobs = @()
        
        foreach ($service in $services) {
          $startJobs += Start-Job -ScriptBlock {
            param($serviceName, $binPath)
            Set-Location $binPath
            & cmd /c ".\nssm.exe" start $serviceName 2>&1 | Out-Null
          } -ArgumentList $service, $env:BIN_PATH
        }
        
        # Wait for all start jobs to complete (max 15 seconds)
        $startJobs | Wait-Job -Timeout 15 | Out-Null
        
        # Quick status check
        foreach ($service in $services) {
          $status = (Get-Service -Name $service -ErrorAction SilentlyContinue).Status
          Write-Host "$service status: $status"
        }
        Write-Host "All services started"
