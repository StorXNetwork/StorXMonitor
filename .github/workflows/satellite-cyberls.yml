name: Build Satellite on CyberLS
run-name: Build Satellite on CyberLS (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment to update'
        required: true
        default: google
        type: choice
        options:
          - google
          - microsoft
      run_go_mod_tidy:
        description: 'Run go mod tidy'
        required: false
        default: false
        type: boolean

# Google and Microsoft share one binary, so deploys must not overlap.
concurrency:
  group: cyberls
  cancel-in-progress: false

env:
  BIN_PATH: 'D:\bin'
  TEMP_PATH: 'D:\deployment'
  MAIL_TEMPLATES_PATH: ${{ inputs.target == 'microsoft' && 'D:\cyberls-microsoft\Mails' || 'D:\Mails' }}
  # Each target has its own NSSM service. The service runs storxnetwork-sim, which locks satellite.exe children.
  SERVICE: ${{ inputs.target == 'microsoft' && 'Cyberls-Microsoft-Satellite' || 'Cyberls-Satellite' }}

jobs:
  build-satellite:
    runs-on: [self-hosted, windows, production, cyberls]
    environment: ${{ inputs.target == 'microsoft' && 'cyberls-microsoft' || 'production' }}
    steps:
    - name: Check deployment target
      shell: powershell
      run: |
        Write-Host "Service: $env:SERVICE, bin: $env:BIN_PATH, mails: $env:MAIL_TEMPLATES_PATH"
        if (-not (Test-Path "$env:BIN_PATH\nssm.exe")) { Write-Error "nssm.exe not found in $env:BIN_PATH"; exit 1 }
        if (-not (Get-Service -Name $env:SERVICE -ErrorAction SilentlyContinue)) { Write-Error "Service $env:SERVICE is not installed"; exit 1 }
        New-Item -ItemType Directory -Force -Path $env:TEMP_PATH | Out-Null

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Setup Git Auth for Private Go Modules
      shell: powershell
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git config --global url."https://x-access-token:$env:PERSONAL_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"
        go version
        go env
        go env -w GOPRIVATE=github.com/StorXNetwork/*
        go env -w GONOSUMDB=github.com/StorXNetwork/*
        go env -w GONOPROXY=github.com/StorXNetwork/*
        $gomodcache = if ($env:RUNNER_TEMP) { "$env:RUNNER_TEMP\go-mod-cache" } else { "$env:GITHUB_WORKSPACE\.go-mod-cache" }
        New-Item -ItemType Directory -Force -Path $gomodcache | Out-Null
        go env -w GOMODCACHE=$gomodcache

    - name: Go mod tidy
      if: github.event_name == 'workflow_dispatch' && inputs.run_go_mod_tidy == true
      shell: powershell
      run: go mod tidy

    - name: Fast build satellite.exe
      shell: powershell
      env:
        WEB3_AUTH_PRIVATE_KEY: ${{ secrets.WEB3_AUTH_PRIVATE_KEY }}
      run: |
        $buildStart = Get-Date
        Write-Host "Building satellite.exe with optimizations..."
        
        # Use Go build cache and skip tests for faster build
        $env:GOFLAGS = "-buildvcs=false"
        
        $out = "$env:TEMP_PATH\satellite.exe"
        # A leftover exe from an interrupted run would otherwise be deployed when this build fails.
        Remove-Item $out -Force -ErrorAction SilentlyContinue

        $ldflags = "-s -w -X 'github.com/StorXNetwork/StorXMonitor/satellite/console/secretconstants.Web3AuthPrivateKey=$env:WEB3_AUTH_PRIVATE_KEY'"
        go build -ldflags $ldflags -o $out ./cmd/satellite
        if ($LASTEXITCODE -ne 0) {
          Write-Error "go build failed with exit code $LASTEXITCODE"
          exit 1
        }

        $buildTime = (Get-Date) - $buildStart
        Write-Host "Build completed in $($buildTime.TotalSeconds) seconds"

        if (Test-Path $out) {
          $size = (Get-Item $out).Length
          Write-Host "satellite.exe built successfully ($([math]::Round($size/1MB, 2)) MB)"
        } else {
          Write-Error "Build failed - satellite.exe not found"
          exit 1
        }
        
    - name: Service stop
      shell: powershell
      run: |
        $job = Start-Job -ScriptBlock {
          param($serviceName, $binPath)
          Set-Location $binPath
          $status = (Get-Service -Name $serviceName -ErrorAction SilentlyContinue).Status
          if ($status -eq "Running" -or $status -eq "Paused" -or $status -eq "StartPending") {
            & ".\nssm.exe" stop $serviceName 2>&1 | Out-Null
          }
        } -ArgumentList $env:SERVICE, $env:BIN_PATH

        # Wait for the stop to complete (max 30 seconds), then let Windows release file locks
        $job | Wait-Job -Timeout 30 | Out-Null
        # Shared D:\bin binaries: nssm cannot open the other CyberLS service from this job, so stop the processes that hold the lock.
        Get-Process -Name storxnetwork-sim,satellite -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "Stopping $($_.Name).exe PID $($_.Id)"
          Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
        }
        Start-Sleep -Seconds 3
        Write-Host "$env:SERVICE stopped or timeout reached"
        
    - name: Quick file replacement
      shell: powershell
      run: |
        $src = "$env:TEMP_PATH\satellite.exe"
        $dst = "$env:BIN_PATH\satellite.exe"
        if (-not (Test-Path $src)) { Write-Error "Missing build output: $src"; exit 1 }

        # Same as Backup-Tools: copy over the existing exe. Do not delete it first.
        # Microsoft NSSM restarts satellite.exe while this job runs, so Remove-Item stays locked.
        try {
          Copy-Item $src $dst -Force -ErrorAction Stop
        } catch {
          $bak = "$dst.old"
          Remove-Item $bak -Force -ErrorAction SilentlyContinue
          Move-Item $dst $bak -Force
          Copy-Item $src $dst -Force
          Remove-Item $bak -Force -ErrorAction SilentlyContinue
        }
        Remove-Item $src -Force -ErrorAction SilentlyContinue
        Write-Host "satellite.exe replaced"

    - name: Deploy mail templates
      shell: powershell
      run: |
        $src = Join-Path $env:GITHUB_WORKSPACE 'mail-templates'
        $dest = $env:MAIL_TEMPLATES_PATH
        if (-not (Test-Path $src)) {
          Write-Error "mail-templates directory not found at $src"
          exit 1
        }
        if (Test-Path $dest) {
          Remove-Item $dest -Recurse -Force
        }
        Copy-Item -Path $src -Destination $dest -Recurse -Force
        $count = (Get-ChildItem (Join-Path $dest 'emails') -Filter '*.html').Count
        Write-Host "Deployed $count email templates to $dest"
        
    - name: Service start
      shell: powershell
      run: |
        Set-Location $env:BIN_PATH
        $service = Get-Service -Name $env:SERVICE -ErrorAction Stop
        if ($service.Status -ne "Running") {
          # nssm returns an error for SERVICE_START_PENDING even when the start succeeds, so the result is checked below instead.
          $ErrorActionPreference = "Continue"
          & cmd /c ".\nssm.exe" start $env:SERVICE 2>&1 | Out-Host
          $ErrorActionPreference = "Stop"
        }

        $deadline = (Get-Date).AddSeconds(30)
        do {
          Start-Sleep -Seconds 1
          $service.Refresh()
        } while ($service.Status -ne "Running" -and (Get-Date) -lt $deadline)
        if ($service.Status -ne "Running") {
          Write-Error "$env:SERVICE did not reach Running (status: $($service.Status))"
          exit 1
        }

        # nssm restarts a crashing app and the service can still look Running, so the same sim process must survive the whole window.
        # The sim is found as the child of the service's nssm process: executable paths are hidden from non-admin runner accounts.
        function Get-SimProcessIds {
          $nssmPid = (Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE'").ProcessId
          if (-not $nssmPid) { return @() }
          @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$nssmPid AND Name='storxnetwork-sim.exe'" | ForEach-Object { $_.ProcessId })
        }
        $before = Get-SimProcessIds
        Start-Sleep -Seconds 20
        $service.Refresh()
        $after = Get-SimProcessIds
        $survived = @($after | Where-Object { $before -contains $_ })
        if ($service.Status -ne "Running" -or $survived.Count -eq 0) {
          Write-Error "$env:SERVICE is not stable (status: $($service.Status), sim processes before: $($before -join ','), after: $($after -join ',')). Check the service logs."
          exit 1
        }
        Write-Host "$env:SERVICE is running (storxnetwork-sim PID $($survived -join ','))"
        exit 0
