name: Build Storxnetwork Sim on CyberLS
run-name: Build Storxnetwork Sim on CyberLS (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment to update'
        required: true
        default: google
        type: choice
        options:
          - google
          - microsoft
      run_go_mod_tidy:
        description: 'Run go mod tidy'
        required: false
        default: false
        type: boolean

# Google and Microsoft share one binary, so deploys must not overlap.
concurrency:
  group: cyberls
  cancel-in-progress: false

env:
  BIN_PATH: 'D:\bin'
  TEMP_PATH: 'D:\deployment'
  SERVICE: ${{ inputs.target == 'microsoft' && 'Cyberls-Microsoft-Satellite' || 'Cyberls-Satellite' }}

jobs:
  build-storxnetwork-sim:
    runs-on: [self-hosted, windows, CyberLS]
    environment: ${{ inputs.target == 'microsoft' && 'cyberls-microsoft' || 'production' }}
    steps:
    - name: Check deployment target
      shell: powershell
      run: |
        Write-Host "Service: $env:SERVICE, bin: $env:BIN_PATH"
        if (-not (Test-Path "$env:BIN_PATH\nssm.exe")) { Write-Error "nssm.exe not found in $env:BIN_PATH"; exit 1 }
        if (-not (Get-Service -Name $env:SERVICE -ErrorAction SilentlyContinue)) { Write-Error "Service $env:SERVICE is not installed"; exit 1 }
        New-Item -ItemType Directory -Force -Path $env:TEMP_PATH | Out-Null

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Setup Git Auth for Private Go Modules
      shell: powershell
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git config --global url."https://x-access-token:$env:PERSONAL_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"
        go env -w GOPRIVATE=github.com/StorXNetwork/*
        go env -w GONOSUMDB=github.com/StorXNetwork/*
        go env -w GONOPROXY=github.com/StorXNetwork/*
        $gomodcache = if ($env:RUNNER_TEMP) { "$env:RUNNER_TEMP\go-mod-cache" } else { "$env:GITHUB_WORKSPACE\.go-mod-cache" }
        New-Item -ItemType Directory -Force -Path $gomodcache | Out-Null
        go env -w GOMODCACHE=$gomodcache

    - name: Go mod tidy
      if: github.event_name == 'workflow_dispatch' && inputs.run_go_mod_tidy == true
      shell: powershell
      run: go mod tidy

    - name: Build storxnetwork-sim.exe
      shell: powershell
      run: |
        go build -ldflags "-s -w" -o "$env:TEMP_PATH\storxnetwork-sim.exe" ./cmd/storxnetwork-sim
        
    - name: Quick service stop
      shell: powershell
      run: |
        Set-Location $env:BIN_PATH
        $status = (Get-Service -Name $env:SERVICE -ErrorAction SilentlyContinue).Status 
        if ($status -eq "Running" -or $status -eq "Paused" -or $status -eq "StartPending") {
          & ".\nssm.exe" stop $env:SERVICE 2>&1 | Out-Null
          Start-Sleep -Seconds 5
        }
        
    - name: Quick file replacement
      shell: powershell
      run: |
        $src = "$env:TEMP_PATH\storxnetwork-sim.exe"
        $dst = "$env:BIN_PATH\storxnetwork-sim.exe"
        # Retry delete - handle can linger a few seconds after nssm stop
        for ($i = 0; $i -lt 15; $i++) {
          if (-not (Test-Path $dst)) { break }
          try {
            Remove-Item $dst -Force -ErrorAction Stop
            break
          } catch {
            Start-Sleep -Seconds 1
          }
        }
        if (Test-Path $dst) {
          Write-Error "Cannot remove $dst (still locked). Is $env:SERVICE fully stopped?"
          exit 1
        }
        Move-Item $src $dst -Force
        Write-Host "storxnetwork-sim.exe replaced"
        
    - name: Quick service start
      shell: powershell
      run: |
        Set-Location $env:BIN_PATH
        $service = Get-Service -Name $env:SERVICE -ErrorAction Stop
        if ($service.Status -ne "Running") {
          # nssm returns an error for SERVICE_START_PENDING even when the start succeeds, so the result is checked below instead.
          $ErrorActionPreference = "Continue"
          & cmd /c ".\nssm.exe" start $env:SERVICE 2>&1 | Out-Host
          $ErrorActionPreference = "Stop"
        }

        $deadline = (Get-Date).AddSeconds(30)
        do {
          Start-Sleep -Seconds 1
          $service.Refresh()
        } while ($service.Status -ne "Running" -and (Get-Date) -lt $deadline)
        if ($service.Status -ne "Running") {
          Write-Error "$env:SERVICE did not reach Running (status: $($service.Status))"
          exit 1
        }

        # nssm restarts a crashing app and the service can still look Running, so the same sim process must survive the whole window.
        # The sim is found as the child of the service's nssm process: executable paths are hidden from non-admin runner accounts.
        function Get-SimProcessIds {
          $nssmPid = (Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE'").ProcessId
          if (-not $nssmPid) { return @() }
          @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$nssmPid AND Name='storxnetwork-sim.exe'" | ForEach-Object { $_.ProcessId })
        }
        $before = Get-SimProcessIds
        Start-Sleep -Seconds 20
        $service.Refresh()
        $after = Get-SimProcessIds
        $survived = @($after | Where-Object { $before -contains $_ })
        if ($service.Status -ne "Running" -or $survived.Count -eq 0) {
          Write-Error "$env:SERVICE is not stable (status: $($service.Status), sim processes before: $($before -join ','), after: $($after -join ',')). Check the service logs."
          exit 1
        }
        Write-Host "$env:SERVICE is running (storxnetwork-sim PID $($survived -join ','))"
        exit 0
