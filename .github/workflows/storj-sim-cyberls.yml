name: Build StorXNetwork Sim on CyberLS

on:
  workflow_dispatch:
    inputs:
      run_go_mod_tidy:
        description: 'Run go mod tidy'
        required: false
        default: false
        type: boolean

env:
  BIN_PATH: 'D:\bin'
  TEMP_PATH: 'D:\deployment'
  # Real NSSM service on CyberLS (runs D:\bin\storxnetwork-sim.exe)
  SERVICE_NAME: 'Cyberls-Satellite'

jobs:
  build-storxnetwork-sim:
    runs-on: [self-hosted, windows, CyberLS]
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Setup Git Auth for Private Go Modules
      shell: powershell
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git config --global url."https://x-access-token:$env:PERSONAL_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"
        go env -w GOPRIVATE=github.com/StorXNetwork/*
        go env -w GONOSUMDB=github.com/StorXNetwork/*
        go env -w GONOPROXY=github.com/StorXNetwork/*
        $gomodcache = if ($env:RUNNER_TEMP) { "$env:RUNNER_TEMP\go-mod-cache" } else { "$env:GITHUB_WORKSPACE\.go-mod-cache" }
        New-Item -ItemType Directory -Force -Path $gomodcache | Out-Null
        go env -w GOMODCACHE=$gomodcache

    - name: Go mod tidy
      if: github.event_name == 'workflow_dispatch' && inputs.run_go_mod_tidy == true
      shell: powershell
      run: go mod tidy

    - name: Fast build storxnetwork-sim.exe
      run: |
        $buildStart = Get-Date
        Write-Host "Building storxnetwork-sim.exe with optimizations..."
        
        $env:GOFLAGS = "-buildvcs=false"
        
        $buildCmd = "go build -ldflags `"-s -w`" -o `"$env:TEMP_PATH\storxnetwork-sim.exe`" ./cmd/storxnetwork-sim"
        Write-Host "Build command: $buildCmd"
        
        Invoke-Expression $buildCmd
        
        $buildTime = (Get-Date) - $buildStart
        Write-Host "Build completed in $($buildTime.TotalSeconds) seconds"
        
        if (Test-Path "$env:TEMP_PATH\storxnetwork-sim.exe") {
          $size = (Get-Item "$env:TEMP_PATH\storxnetwork-sim.exe").Length
          Write-Host "storxnetwork-sim.exe built successfully ($([math]::Round($size/1MB, 2)) MB)"
        } else {
          Write-Error "Build failed - storxnetwork-sim.exe not found"
          exit 1
        }
        
    - name: Quick service stop
      run: |
        Set-Location $env:BIN_PATH
        $name = $env:SERVICE_NAME
        $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
        if (-not $svc) {
          Write-Error "Service $name not found"
          exit 1
        }
        Write-Host "Service $name Status=$($svc.Status)"
        if ($svc.Status -eq "Stopped") {
          Write-Host "Already stopped"
          exit 0
        }

        # Prefer Windows SCM (Stop-Service / sc). nssm often fails with
        # "Can't open service!" when the runner is not elevated the same as install.
        $ErrorActionPreference = "Continue"
        Write-Host "Stop-Service $name"
        Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 2
        $svc.Refresh()
        if ($svc.Status -ne "Stopped") {
          Write-Host "sc.exe stop $name"
          cmd /c "sc.exe stop `"$name`"" 2>&1 | Out-Host
          Start-Sleep -Seconds 2
          $svc.Refresh()
        }
        if ($svc.Status -ne "Stopped") {
          Write-Host "nssm stop $name (fallback)"
          & ".\nssm.exe" stop $name 2>&1 | Out-Host
          Start-Sleep -Seconds 2
          $svc.Refresh()
        }
        $ErrorActionPreference = "Stop"

        Write-Host "Service $name now Status=$($svc.Status)"
        if ($svc.Status -ne "Stopped") {
          Write-Error "Could not stop $name (Status=$($svc.Status)). Runner needs rights to control this service (run Actions runner as Admin, or grant service stop permission)."
          exit 1
        }
        
    - name: Quick file replacement
      run: |
        if (Test-Path "$env:BIN_PATH\storxnetwork-sim.exe") {
          Remove-Item "$env:BIN_PATH\storxnetwork-sim.exe" -Force -ErrorAction SilentlyContinue
        }
        Move-Item "$env:TEMP_PATH\storxnetwork-sim.exe" "$env:BIN_PATH\storxnetwork-sim.exe" -Force
        Write-Host "storxnetwork-sim.exe replaced"
        
    - name: Quick service start
      run: |
        Set-Location $env:BIN_PATH
        $name = $env:SERVICE_NAME
        $service = Get-Service -Name $name -ErrorAction SilentlyContinue
        if (-not $service) {
          Write-Error "Service $name not found"
          exit 1
        }

        $maxWait = 10
        while ($maxWait -gt 0 -and ($service.Status -match "Pending")) {
          Start-Sleep -Seconds 1
          $service.Refresh()
          $maxWait--
        }

        if ($service.Status -eq "Stopped") {
          $ErrorActionPreference = "Continue"
          Write-Host "Starting $name"
          Start-Service -Name $name -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $service.Refresh()
          if ($service.Status -eq "Stopped") {
            cmd /c "sc.exe start `"$name`"" 2>&1 | Out-Host
            Start-Sleep -Seconds 2
            $service.Refresh()
          }
          if ($service.Status -eq "Stopped") {
            & cmd /c ".\nssm.exe" start $name 2>&1 | Out-Host
            Start-Sleep -Seconds 3
            $service.Refresh()
          }
          $ErrorActionPreference = "Stop"
          Write-Host "Service $name Status=$($service.Status)"
          if ($service.Status -eq "Running" -or $service.Status -eq "StartPending") {
            exit 0
          }
          Write-Error "Failed to start $name (Status=$($service.Status))"
          exit 1
        } elseif ($service.Status -eq "Running") {
          Write-Host "Service $name already running"
          exit 0
        } else {
          Write-Host "Service $name in unexpected state: $($service.Status)"
        }
