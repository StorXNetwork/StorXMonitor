name: Build Storxnetwork Sim on CyberLS
run-name: Build Storxnetwork Sim on CyberLS (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment to update'
        required: true
        default: google
        type: choice
        options:
          - google
          - microsoft
      run_go_mod_tidy:
        description: 'Run go mod tidy'
        required: false
        default: false
        type: boolean

# Google and Microsoft share one binary, so deploys must not overlap.
concurrency:
  group: cyberls
  cancel-in-progress: false

env:
  BIN_PATH: 'D:\bin'
  TEMP_PATH: 'D:\deployment'
  SERVICE: ${{ inputs.target == 'microsoft' && 'Cyberls-Microsoft-Satellite' || 'Cyberls-Satellite' }}

jobs:
  build-storxnetwork-sim:
    runs-on: [self-hosted, windows, CyberLS]
    environment: ${{ inputs.target == 'microsoft' && 'cyberls-microsoft' || 'production' }}
    steps:
    - name: Check deployment target
      shell: powershell
      run: |
        Write-Host "Service: $env:SERVICE, bin: $env:BIN_PATH"
        if (-not (Test-Path "$env:BIN_PATH\nssm.exe")) { Write-Error "nssm.exe not found in $env:BIN_PATH"; exit 1 }
        if (-not (Get-Service -Name $env:SERVICE -ErrorAction SilentlyContinue)) { Write-Error "Service $env:SERVICE is not installed"; exit 1 }
        New-Item -ItemType Directory -Force -Path $env:TEMP_PATH | Out-Null

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Setup Git Auth for Private Go Modules
      shell: powershell
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        $token = "$env:PERSONAL_ACCESS_TOKEN".Trim()
        if (-not $token) {
          Write-Error "PERSONAL_ACCESS_TOKEN is empty for this job."
          exit 1
        }
        Write-Host ("Repository PAT length " + $token.Length)
        # Older runs left extra insteadOf rules on this runner. Git can keep using one of those.
        $oldRules = git config --global --name-only --get-regexp '^url\..*\.insteadof$' 2>$null
        foreach ($name in @($oldRules)) {
          if ($name) { git config --global --unset-all $name 2>$null | Out-Null }
        }
        # Windows Credential Manager otherwise sends a saved GitHub login instead of this token.
        git config --global credential.helper ""
        git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
        "GIT_TERMINAL_PROMPT=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "GCM_INTERACTIVE=Never" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        go env -w GOPRIVATE=github.com/StorXNetwork/*
        go env -w GONOSUMDB=github.com/StorXNetwork/*
        go env -w GONOPROXY=github.com/StorXNetwork/*
        $gomodcache = if ($env:RUNNER_TEMP) { "$env:RUNNER_TEMP\go-mod-cache" } else { "$env:GITHUB_WORKSPACE\.go-mod-cache" }
        New-Item -ItemType Directory -Force -Path $gomodcache | Out-Null
        go env -w GOMODCACHE=$gomodcache

    - name: Go mod tidy
      if: github.event_name == 'workflow_dispatch' && inputs.run_go_mod_tidy == true
      shell: powershell
      run: go mod tidy

    - name: Build storxnetwork-sim.exe
      shell: powershell
      run: |
        go build -ldflags "-s -w" -o "$env:TEMP_PATH\storxnetwork-sim.exe" ./cmd/storxnetwork-sim
        
    - name: Quick service stop
      shell: powershell
      run: |
        Set-Location $env:BIN_PATH
        $names = @('Cyberls-Satellite', 'Cyberls-Microsoft-Satellite')
        foreach ($name in $names) {
          $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
          if (-not $svc) {
            Write-Host "$name not installed, skip stop"
            continue
          }
          Write-Host "Stopping $name"
          # This job cannot always open the other NSSM service. Use SCM first; never fail on nssm stderr.
          $ErrorActionPreference = 'Continue'
          try {
            Stop-Service -Name $name -Force -ErrorAction Stop
          } catch {
            Write-Host "Stop-Service $name : $($_.Exception.Message)"
            cmd /c "nssm.exe stop $name >nul 2>&1"
          }
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            $svc.Refresh()
          } while ($svc.Status -ne 'Stopped' -and (Get-Date) -lt $deadline)
          Write-Host "$name status: $($svc.Status)"
        }
        Get-Process -Name storxnetwork-sim,satellite -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "Stopping leftover $($_.Name).exe PID $($_.Id)"
          Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
        }
        Start-Sleep -Seconds 5
        Write-Host "Google and Microsoft satellite processes are down"
        
    - name: Quick file replacement
      shell: powershell
      run: |
        $src = "$env:TEMP_PATH\storxnetwork-sim.exe"
        $dst = "$env:BIN_PATH\storxnetwork-sim.exe"
        if (-not (Test-Path $src)) { Write-Error "Missing build output: $src"; exit 1 }

        # Same as Backup-Tools: copy over the existing exe. Do not delete it first.
        try {
          Copy-Item $src $dst -Force -ErrorAction Stop
        } catch {
          $bak = "$dst.old"
          Remove-Item $bak -Force -ErrorAction SilentlyContinue
          Move-Item $dst $bak -Force
          Copy-Item $src $dst -Force
          Remove-Item $bak -Force -ErrorAction SilentlyContinue
        }
        Remove-Item $src -Force -ErrorAction SilentlyContinue
        Write-Host "storxnetwork-sim.exe replaced"
        
    - name: Quick service start
      shell: powershell
      run: |
        Set-Location $env:BIN_PATH
        $names = @('Cyberls-Satellite', 'Cyberls-Microsoft-Satellite')

        function Get-SimProcessIds([string]$serviceName) {
          $nssmPid = (Get-CimInstance Win32_Service -Filter "Name='$serviceName'").ProcessId
          if (-not $nssmPid) { return @() }
          @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$nssmPid AND Name='storxnetwork-sim.exe'" | ForEach-Object { $_.ProcessId })
        }

        $started = @()
        foreach ($name in $names) {
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue
          if (-not $service) {
            Write-Host "$name not installed, skip"
            continue
          }
          Write-Host "Starting $name"
          $ErrorActionPreference = 'Continue'
          try {
            Start-Service -Name $name -WarningAction SilentlyContinue -ErrorAction Stop
          } catch {
            Write-Host "Start-Service $name : $($_.Exception.Message)"
            cmd /c "nssm.exe start $name >nul 2>&1"
          }
          $ErrorActionPreference = 'Stop'
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            $service.Refresh()
          } while ($service.Status -ne 'Running' -and (Get-Date) -lt $deadline)
          if ($service.Status -ne 'Running') {
            Write-Error "$name did not reach Running (status: $($service.Status))"
            exit 1
          }
          Write-Host "$name is Running"
          $started += $name
        }

        if ($started.Count -eq 0) {
          Write-Error "No CyberLS satellite service started"
          exit 1
        }

        $before = @{}
        foreach ($name in $started) {
          $before[$name] = @(Get-SimProcessIds $name)
        }
        Start-Sleep -Seconds 20
        foreach ($name in $started) {
          $service = Get-Service -Name $name -ErrorAction Stop
          $service.Refresh()
          $after = @(Get-SimProcessIds $name)
          $survived = @($after | Where-Object { $before[$name] -contains $_ })
          if ($service.Status -ne 'Running' -or $survived.Count -eq 0) {
            Write-Error "$name is not stable (status: $($service.Status), sim processes before: $($before[$name] -join ','), after: $($after -join ',')). Check the service logs."
            exit 1
          }
          Write-Host "$name is stable (storxnetwork-sim PID $($survived -join ','))"
        }
        exit 0
