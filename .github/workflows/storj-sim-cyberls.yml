name: Build StorXNetwork Sim on CyberLS

on:
  workflow_dispatch:
    inputs:
      run_go_mod_tidy:
        description: 'Run go mod tidy'
        required: false
        default: false
        type: boolean

env:
  BIN_PATH: 'D:\bin'
  TEMP_PATH: 'D:\deployment'

jobs:
  build-storxnetwork-sim:
    runs-on: [self-hosted, windows, CyberLS]
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Setup Git Auth for Private Go Modules
      shell: powershell
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git config --global url."https://x-access-token:$env:PERSONAL_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"
        go env -w GOPRIVATE=github.com/StorXNetwork/*
        go env -w GONOSUMDB=github.com/StorXNetwork/*
        go env -w GONOPROXY=github.com/StorXNetwork/*
        $gomodcache = if ($env:RUNNER_TEMP) { "$env:RUNNER_TEMP\go-mod-cache" } else { "$env:GITHUB_WORKSPACE\.go-mod-cache" }
        New-Item -ItemType Directory -Force -Path $gomodcache | Out-Null
        go env -w GOMODCACHE=$gomodcache

    - name: Go mod tidy
      if: github.event_name == 'workflow_dispatch' && inputs.run_go_mod_tidy == true
      shell: powershell
      run: go mod tidy

    - name: Fast build storxnetwork-sim.exe
      run: |
        $buildStart = Get-Date
        Write-Host "Building storxnetwork-sim.exe with optimizations..."
        
        # Use Go build cache and skip tests for faster build
        $env:GOFLAGS = "-buildvcs=false"
        
        $buildCmd = "go build -ldflags `"-s -w`" -o `"$env:TEMP_PATH\storxnetwork-sim.exe`" ./cmd/storxnetwork-sim"
        Write-Host "Build command: $buildCmd"
        
        Invoke-Expression $buildCmd
        
        $buildTime = (Get-Date) - $buildStart
        Write-Host "Build completed in $($buildTime.TotalSeconds) seconds"
        
        if (Test-Path "$env:TEMP_PATH\storxnetwork-sim.exe") {
          $size = (Get-Item "$env:TEMP_PATH\storxnetwork-sim.exe").Length
          Write-Host "storxnetwork-sim.exe built successfully ($([math]::Round($size/1MB, 2)) MB)"
        } else {
          Write-Error "Build failed - storxnetwork-sim.exe not found"
          exit 1
        }
        
    - name: Quick service stop
      run: |
        Set-Location $env:BIN_PATH

        foreach ($name in @('storxnetwork-sim', 'storxnetworksatellite')) {
          $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
          if (-not $svc) {
            Write-Host "Service $name not found"
            continue
          }
          Write-Host "Service $name Status=$($svc.Status)"
          if ($svc.Status -ne "Stopped") {
            Write-Host "Stopping $name via nssm"
            & ".\nssm.exe" stop $name 2>&1 | Out-Host
          }
        }

        # Runner may not kill via Stop-Process (service runs as another user) - use taskkill
        Write-Host "taskkill /F /IM storxnetwork-sim.exe"
        $ErrorActionPreference = "Continue"
        cmd /c "taskkill /F /IM storxnetwork-sim.exe /T" 2>&1 | Out-Host
        $ErrorActionPreference = "Stop"
        Start-Sleep -Seconds 3

        $left = Get-Process -Name 'storxnetwork-sim' -ErrorAction SilentlyContinue
        if ($left) {
          Write-Host "Process still alive after taskkill:"
          $left | Format-Table Id, ProcessName, Path -AutoSize | Out-String | Write-Host
          Write-Error "Cannot kill storxnetwork-sim (PID(s) still running). Runner needs rights to stop that process/service."
          exit 1
        }
        Write-Host "OK: no storxnetwork-sim process"

    - name: Quick file replacement
      run: |
        $src = "$env:TEMP_PATH\storxnetwork-sim.exe"
        $dst = "$env:BIN_PATH\storxnetwork-sim.exe"

        Write-Host "SRC exists=$(Test-Path $src) path=$src"
        Write-Host "DST exists=$(Test-Path $dst) path=$dst"

        $left = Get-Process -Name 'storxnetwork-sim' -ErrorAction SilentlyContinue
        if ($left) {
          Write-Host "Process back before replace - taskkill again"
          cmd /c "taskkill /F /IM storxnetwork-sim.exe /T" 2>&1 | Out-Host
          Start-Sleep -Seconds 2
          $left = Get-Process -Name 'storxnetwork-sim' -ErrorAction SilentlyContinue
          if ($left) {
            $left | Format-Table Id, ProcessName, Path -AutoSize | Out-String | Write-Host
            Write-Error "storxnetwork-sim still running; cannot replace exe"
            exit 1
          }
        }

        if (Test-Path $dst) {
          Write-Host "Removing old DST..."
          try {
            Remove-Item $dst -Force -ErrorAction Stop
            Write-Host "Remove-Item OK"
          } catch {
            Write-Host "Remove-Item FAILED: $($_.Exception.Message)"
            Get-Process -Name 'storxnetwork-sim' -ErrorAction SilentlyContinue |
              Format-Table Id, ProcessName, Path -AutoSize | Out-String | Write-Host
            Write-Error "Cannot delete $dst (file locked)."
            exit 1
          }
        } else {
          Write-Host "DST already absent"
        }

        if (Test-Path $dst) {
          Write-Error "DST still exists after Remove-Item: $dst"
          exit 1
        }
        if (-not (Test-Path $src)) {
          Write-Error "Missing build output: $src"
          exit 1
        }

        Write-Host "Moving SRC -> DST"
        Move-Item $src $dst -Force
        Write-Host "storxnetwork-sim.exe replaced OK"
        
    - name: Quick service start
      run: |
        Set-Location $env:BIN_PATH
        foreach ($name in @('storxnetwork-sim', 'storxnetworksatellite')) {
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue
          if (-not $service) {
            Write-Host "Service $name not found (skip)"
            continue
          }

          $maxWait = 10
          while ($maxWait -gt 0 -and ($service.Status -match "Pending")) {
            Start-Sleep -Seconds 1
            $service.Refresh()
            $maxWait--
          }

          if ($service.Status -eq "Stopped") {
            $ErrorActionPreference = "Continue"
            $result = & cmd /c ".\nssm.exe" start $name 2>&1 | Out-String
            $ErrorActionPreference = "Stop"
            Start-Sleep -Seconds 3
            $service.Refresh()

            if ($result -match "SERVICE_START_PENDING" -or $service.Status -eq "Running" -or $service.Status -eq "StartPending") {
              Write-Host "Service $name started (Status: $($service.Status))"
            } else {
              Write-Host "Service $name unexpected state: $($service.Status)"
            }
          } elseif ($service.Status -eq "Running") {
            Write-Host "Service $name already running"
          } else {
            Write-Host "Service $name in unexpected state: $($service.Status)"
          }
        }
